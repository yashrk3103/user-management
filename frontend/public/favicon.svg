<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="brand-grad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#1E5BB8" />
      <stop offset="100%" stop-color="#5F91DD" />
    </linearGradient>
  </defs>

  <!-- Outer rounded background -->
  <rect x="4" y="4" width="92" height="92" rx="28" ry="28" fill="url(#brand-grad)" stroke="#7FA6E3" stroke-width="3" />

  <!-- Inner rounded frame -->
  <rect x="21" y="21" width="58" height="58" rx="16" ry="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3" />

  <!-- 4 Corner Node Dots -->
  <circle cx="31" cy="31" r="7" fill="#FFFFFF" />
  <circle cx="69" cy="31" r="7" fill="#FFFFFF" />
  <circle cx="31" cy="69" r="7" fill="#FFFFFF" />
  <circle cx="69" cy="69" r="7" fill="#FFFFFF" />
</svg>